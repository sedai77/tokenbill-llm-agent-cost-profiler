# File ownership of Token Bill v0.2 (SPEC-v0.2 Appendix O = PLAN-v0.2 §2.1), enforced by
# scripts/check_ownership.py (CI: .github/workflows/ownership.yml). Brace groups of the SPEC table are
# expanded to one path each. Patterns: "*" matches within one path segment, "**" any number of segments.
# Every repository file belongs to exactly one package, to INTEGRATION, or is FROZEN; FROZEN files are
# never edited by anyone. Changing this file is a contract change (SPEC §21 #3).
# GitHub Copilot (wave 1.5, CORE-AMENDMENTS C-32): the rows of SPEC-v0.2-COPILOT §21.3 (revision 3.1)
# = the Owns sections of the Copilot briefs: F-EXT, F-POOL and the 19 CP-* packages;
# tokenbill/copilot/__init__.py belongs to F-CORE; tokenbill/outputs/ccusage.py moved from OUT to
# CLI-LEDGER (addendum §21.5). F-SEM-C and F-KIT-C edit files under F-SEM's / F-KIT's rows.

schema = "tokenbill/ownership@1"

[frozen]
paths = [
  "tokenbill/__main__.py",
  "tokenbill/common.py",
  "tokenbill/trace.py",
  "tokenbill/analyzer.py",
  "tokenbill/simulator.py",
