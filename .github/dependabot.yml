# Dependabot (SPEC §8.10). Token Bill has zero runtime dependencies, so the only things to keep
# current are the SHA-pinned GitHub Actions and the development toolchain (the `dev` extra,
# locked in uv.lock). Updates are grouped into one weekly PR per ecosystem and wait out a
# cooldown, so a freshly published (possibly compromised) release is not pulled in on day one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Dev dependencies (pytest, ruff, hypothesis, coverage). The `uv` ecosystem updates uv.lock
  # together with pyproject.toml; CI installs from uv.lock, so that is what must move.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: deps(dev)
