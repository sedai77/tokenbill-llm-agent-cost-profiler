# zizmor: static analysis of GitHub Actions workflows (SPEC §8.10) - template injection,
# over-broad permissions, credential persistence, unpinned or impostor action commits, cache
# poisoning in publishing workflows, Dependabot settings. Runs when .github/** changes; findings
# fail the check and show up as annotations on the pull request.
name: zizmor

on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]

permissions: {}

concurrency:
  group: zizmor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor (Actions static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout; the online audits read public action repositories
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          persona: regular
          advanced-security: false # annotations instead of SARIF upload: no security-events write
          annotations: true
