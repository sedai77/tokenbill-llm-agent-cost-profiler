# OpenSSF Scorecard (SPEC §8.10): supply-chain posture checks (pinned dependencies, token
# permissions, branch protection, signed releases, ...), weekly and on every push to main.
# Results go to code scanning and, with publish_results, to the public Scorecard API/badge.
# Keep this workflow's shape as it is: publish_results requires a restricted workflow (no
# workflow/job env or defaults, no containers/services, only the steps below, and no write
# permission beyond security-events and id-token).
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "34 2 * * 6" # Saturdays 02:34 UTC
  push:
    branches: [main]

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      actions: read # read workflow runs (e.g. for the CI-Tests check)
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish_results: authenticate to the Scorecard API via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
