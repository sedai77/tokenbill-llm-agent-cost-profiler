# CI: lint, the full suite on the OS x Python matrix, the zero-runtime-dependency gate, per-package
# coverage (non-blocking), the reproducible build, and the offline demo as pipeline proof.
# The ownership gate runs from ownership.yml (F-CORE's file).
#
# Deliberately NO live-API job: Token Bill needs no API keys at all. The `demo` job runs the real
# pipeline offline on synthetic planted-waste traces, and the suite asserts the analyzer recovers
# exactly the waste the demo plants. That is the correctness proof, with zero keys and zero network.
#
# Hardening (SPEC §8.10, docs/SUPPLY-CHAIN.md): every action pinned to a full commit SHA, no
# default token permissions (`permissions: {}`; each job asks for what it needs), checkouts that
# do not persist the token, and no `${{ }}` expansion inside `run:` scripts.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: ruff check
        run: uv run --extra dev ruff check .

  unit:
    name: unit (${{ matrix.os }}, py ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: pytest (full suite)
        env:
          PY: ${{ matrix.python }}
        run: uv run --python "$PY" --extra dev pytest -q

  zero-deps:
    name: zero runtime dependencies (py ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix:
        # The floor and the newest supported interpreter: an unguarded import of a module added
        # to (or removed from) the stdlib in between fails on one of them.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Clean virtual environment (no packages at all)
        env:
          PY: ${{ matrix.python }}
        run: uv venv --no-project --python "$PY" "$RUNNER_TEMP/clean"
      - name: Source tree imports only the standard library
        run: '"$RUNNER_TEMP/clean/bin/python" scripts/check_zero_deps.py'
      - name: Build the wheel
        run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - name: Installed wheel imports only the standard library
        run: |
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" --no-deps "$RUNNER_TEMP"/dist/tokenbill-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/python" "$GITHUB_WORKSPACE/scripts/check_zero_deps.py" \
            --installed --pyproject "$GITHUB_WORKSPACE/pyproject.toml" \
            --wheel "$(ls "$RUNNER_TEMP"/dist/tokenbill-*.whl)"

  coverage:
    name: coverage by package (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Run the suite under coverage
        run: uv run --extra dev coverage run -m pytest -q
      - name: Report by package
        if: ${{ !cancelled() }}
        run: |
          mkdir -p coverage
          uv run --extra dev coverage report > coverage/coverage-report.txt || true
          uv run --extra dev coverage xml -o coverage/coverage.xml || true
          pct() { uv run --extra dev coverage report --include="$1" --format=total 2>/dev/null || echo "n/a"; }
          {
            echo "### Coverage by package (SPEC §8.10 target: >= 90% of owned modules)"
            echo
            echo "| package | line coverage (%) |"
            echo "|---|---:|"
            echo "| \`tokenbill\` (top-level modules) | $(pct 'tokenbill/*.py') |"
            for dir in tokenbill/*/; do
              pkg="${dir%/}"
              [ -f "$pkg/__init__.py" ] || continue
              echo "| \`${pkg//\//.}\` | $(pct "$pkg/*,$pkg/**/*") |"
            done
            echo "| **total** | $(uv run --extra dev coverage report --format=total 2>/dev/null || echo n/a) |"
          } > coverage/coverage-by-package.md
          cat coverage/coverage-by-package.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: build + reproducibility (sdist, wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Build (SOURCE_DATE_EPOCH = the last commit's time)
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv build
      - name: Check metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*
      - name: SBOM (asserts zero runtime components)
        run: |
          uv run --no-project python scripts/sbom.py --wheel "$(ls dist/tokenbill-*.whl)" \
            -o sbom/tokenbill.cdx.json --dev-out sbom/tokenbill.dev.cdx.json
      - name: Rebuild twice and diff against dist/
        run: scripts/repro_check.sh dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.sha }}
          path: |
            dist/
            sbom/
          retention-days: 7

  demo:
    name: offline demo (no keys, no network)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Run the full pipeline offline
        run: uv run tokenbill demo -o "$RUNNER_TEMP/report.html"
      - name: Report must exist and be non-empty
        run: test -s "$RUNNER_TEMP/report.html"
